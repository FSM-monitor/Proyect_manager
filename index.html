<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Gantt</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <!-- Frappe Gantt CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>

  <style>
    /* ------- Estilos personalizados (Dashboard oscuro / glass) ------- */
    * {
      font-family: 'Inter', system-ui, sans-serif;
    }
    body {
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    /* Tarjetas glass */
    .glass-card {
      background: #111111;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #262626;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      padding: 20px;
    }
    /* Acento rojo */
    .accent-red {
      color: #dc2626;
    }
    .accent-red-bg {
      background: #dc2626;
    }
    .accent-red-bg:hover {
      background: #ef4444;
    }
    .accent-red-border {
      border-color: #dc2626;
    }
    .text-secondary {
      color: #a3a3a3;
    }
    /* Contenedor Gantt */
    #gantt-container {
      border-radius: 16px;
      background: #111111;
      border: 1px solid #262626;
      padding: 20px;
      min-height: 400px;
      position: relative;
      overflow: hidden;
    }
    /* Loader */
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
    }
    .spinner {
      border: 4px solid #262626;
      border-top: 4px solid #dc2626;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Mensaje vacío / error */
    .status-msg {
      text-align: center;
      padding: 40px 20px;
      color: #a3a3a3;
    }
    .status-msg .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    /* Toasts */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
      max-width: 340px;
      width: 100%;
    }
    .toast {
      background: #1a1a1a;
      backdrop-filter: blur(12px);
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      gap: 12px;
      color: #f5f5f5;
      font-size: 14px;
      transform: translateX(120%);
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    .toast.success {
      border-left: 4px solid #22c55e;
    }
    .toast.error {
      border-left: 4px solid #dc2626;
    }
    .toast.info {
      border-left: 4px solid #3b82f6;
    }
    .toast .toast-icon {
      font-size: 20px;
    }
    /* Búsqueda */
    #search-input {
      background: #1a1a1a;
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 6px 14px;
      color: #f5f5f5;
      width: 200px;
      transition: border 0.2s;
    }
    #search-input:focus {
      outline: none;
      border-color: #dc2626;
    }
    #search-input::placeholder {
      color: #666;
    }
    /* Ajustes Frappe Gantt para modo oscuro */
    .gantt .bar {
      border-radius: 4px;
    }
    .gantt .bar-progress {
      border-radius: 4px;
    }
    .gantt .grid-header {
      background: #1a1a1a !important;
      color: #a3a3a3 !important;
      border-bottom: 1px solid #262626 !important;
    }
    .gantt .grid-row {
      border-bottom: 1px solid #1a1a1a !important;
    }
    .gantt .grid-row:nth-child(even) {
      background: #0f0f0f !important;
    }
    .gantt .row-label {
      color: #f5f5f5 !important;
    }
    .gantt .popup-wrapper {
      background: #1a1a1a !important;
      border: 1px solid #262626 !important;
      border-radius: 8px !important;
      color: #f5f5f5 !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8) !important;
    }
    .gantt .popup-wrapper .title {
      color: #f5f5f5 !important;
    }
    .gantt .popup-wrapper .subtitle {
      color: #a3a3a3 !important;
    }
    .gantt .popup-wrapper .pointer {
      border-top-color: #1a1a1a !important;
    }
    /* Clases personalizadas para estados (mapeo desde "Estado") */
    .gantt .bar.estado-abierto {
      background: #dc2626 !important;
    }
    .gantt .bar.estado-falta-material {
      background: #eab308 !important;
    }
    .gantt .bar.estado-progreso {
      background: #3b82f6 !important;
    }
    .gantt .bar.estado-completado {
      background: #22c55e !important;
    }
    .gantt .bar.estado-default {
      background: #6b7280 !important;
    }
    /* Ajuste para el progreso dentro de la barra */
    .gantt .bar-progress {
      background: rgba(255,255,255,0.25) !important;
    }
    /* Responsive */
    @media (max-width: 640px) {
      #search-input {
        width: 140px;
      }
      #gantt-container {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="flex flex-wrap items-center justify-between gap-4 mb-6 glass-card">
    <h1 class="text-2xl font-semibold tracking-tight flex items-center gap-2">
      <span class="accent-red"></span> Dashboard Gantt
    </h1>
    <div class="flex flex-wrap items-center gap-3">
      <input
        type="text"
        id="search-input"
        placeholder="Buscar tarea..."
        class="text-sm"
      />
      <button
        id="refresh-btn"
        class="accent-red-bg text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 hover:scale-[1.02] active:scale-[0.98]"
      >
        <span>⟳</span> Actualizar
      </button>
    </div>
  </header>

  <!-- Contenedor principal Gantt -->
  <div id="gantt-container" class="glass-card">
    <!-- Loader (visible por defecto) -->
    <div id="loader">
      <div class="spinner"></div>
      <p class="mt-4 text-secondary text-sm">Cargando datos...</p>
    </div>

    <!-- Mensaje de estado (vacío/error) - oculto por defecto -->
    <div id="status-message" class="status-msg" style="display: none;">
      <div class="icon">📭</div>
      <p id="status-text">No hay tareas para mostrar</p>
    </div>

    <!-- Contenedor donde Frappe Gantt se renderiza -->
    <div id="gantt" style="display: none;"></div>
  </div>

  <!-- Contenedor de Toasts -->
  <div id="toast-container"></div>

  <script>
    (function() {
      'use strict';

      // ---------- CONFIGURACIÓN ----------
      // Cambiar esta URL por la de tu Web App de Apps Script
      const API_URL = 'https://script.google.com/macros/s/AKfycbwrWY39d7lGCl11ZGg3-QlJfa8L7cUyJZwPE3idBTTsoXXUdLqZyLUF4Mp_iPYmiFgNvA/exec'; // Reemplazar

      // ---------- ELEMENTOS DOM ----------
      const ganttContainer = document.getElementById('gantt');
      const loaderEl = document.getElementById('loader');
      const statusMsg = document.getElementById('status-message');
      const statusText = document.getElementById('status-text');
      const refreshBtn = document.getElementById('refresh-btn');
      const searchInput = document.getElementById('search-input');

      // ---------- ESTADO ----------
      let allSections = [];      // datos originales (secciones con tareas)
      let ganttInstance = null; // instancia de Frappe Gantt
      let currentFilter = '';   // filtro de búsqueda

      // ---------- SISTEMA DE TOASTS ----------
      function showToast(message, type = 'info', duration = 3500) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;

        const iconMap = {
          success: '✅',
          error: '❌',
          info: 'ℹ️'
        };
        const icon = iconMap[type] || 'ℹ️';

        toast.innerHTML = `
          <span class="toast-icon">${icon}</span>
          <span>${message}</span>
        `;
        container.appendChild(toast);

        // Forzar reflow para activar transición
        requestAnimationFrame(() => {
          toast.classList.add('show');
        });

        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => {
            if (toast.parentNode) toast.remove();
          }, 300);
        }, duration);
      }

      // ---------- FUNCIONES DE CARGA Y RENDER ----------
      async function loadData() {
        // Mostrar loader, ocultar gantt y mensajes
        loaderEl.style.display = 'flex';
        ganttContainer.style.display = 'block';
        ganttContainer.style.minHeight = '400px';
        ganttContainer.style.position = 'relative';
        ganttContainer.style.overflow = 'hidden';
        ganttContainer.style.padding = '20px';
        ganttContainer.style.background = '#111111'; // mantener fondo
        ganttContainer.style.border = '1px solid #262626';
        ganttContainer.style.borderRadius = '16px';
        
        ganttContainer.querySelector('#gantt').style.display = 'none';
        statusMsg.style.display = 'none';

        try {
          const response = await fetch(API_URL);
          if (!response.ok) {
            throw new Error(`Error HTTP: ${response.status}`);
          }
          const data = await response.json();

          // Esperamos que la API devuelva un objeto con una propiedad "sections"
          // que sea un array de secciones, cada una con { name, tasks: [ { id, name, start, end, progress, custom_class, ... } ] }
          if (!data || typeof data !== 'object' || !Array.isArray(data.sections)) {
            throw new Error('La respuesta no contiene "sections" válido');
          }

          allSections = data.sections;

          // Aplicar filtro si existe
          const filtered = applyFilter(allSections, currentFilter);
          renderGantt(filtered);
          
          // Ocultar loader
          loaderEl.style.display = 'none';
          
          if (filtered.length === 0 || filtered.every(s => s.tasks.length === 0)) {
            // Mostrar mensaje de vacío
            statusMsg.style.display = 'block';
            statusText.textContent = allSections.length === 0 ? 'No hay datos cargados.' : 'No hay tareas que coincidan con la búsqueda.';
            ganttContainer.querySelector('#gantt').style.display = 'none';
          } else {
            statusMsg.style.display = 'none';
            ganttContainer.querySelector('#gantt').style.display = 'block';
          }

          showToast('Datos actualizados correctamente', 'success', 2000);

        } catch (error) {
          console.error('Error al cargar datos:', error);
          loaderEl.style.display = 'none';
          statusMsg.style.display = 'block';
          statusText.textContent = `Error: ${error.message || 'No se pudieron cargar los datos.'}`;
          ganttContainer.querySelector('#gantt').style.display = 'none';
          showToast('Error al cargar datos: ' + error.message, 'error', 4000);
        }
      }

      // ---------- FILTRO ----------
      function applyFilter(sections, filterText) {
        if (!filterText.trim()) return sections;
        const lower = filterText.toLowerCase().trim();
        return sections
          .map(section => {
            const filteredTasks = section.tasks.filter(task =>
              task.name && task.name.toLowerCase().includes(lower)
            );
            return { ...section, tasks: filteredTasks };
          })
          .filter(section => section.tasks.length > 0);
      }

      // ---------- RENDER GANTT ----------
      function renderGantt(sections) {
        // Destruir instancia anterior si existe
        if (ganttInstance) {
          try {
            ganttInstance.destroy();
          } catch (e) {}
          ganttInstance = null;
        }

        // Aplanar tareas para Frappe Gantt
        const tasks = [];
        sections.forEach(section => {
          section.tasks.forEach(task => {
            // Asegurar campos obligatorios
            const t = {
              id: task.id || 'task-' + Math.random().toString(36).substr(2, 9),
              name: task.name || 'Sin nombre',
              start: task.start || new Date().toISOString().split('T')[0],
              end: task.end || new Date().toISOString().split('T')[0],
              progress: typeof task.progress === 'number' ? task.progress : 0,
              custom_class: task.custom_class || 'estado-default'
            };
            tasks.push(t);
          });
        });

        if (tasks.length === 0) {
          // No hay tareas, mostrar mensaje
          ganttContainer.querySelector('#gantt').style.display = 'none';
          statusMsg.style.display = 'block';
          statusText.textContent = 'No hay tareas para mostrar.';
          return;
        }

        // Ocultar mensaje de estado, mostrar gantt
        statusMsg.style.display = 'none';
        const ganttEl = ganttContainer.querySelector('#gantt');
        ganttEl.style.display = 'block';
        ganttEl.innerHTML = ''; // limpiar

        // Crear instancia
        try {
          ganttInstance = new Gantt('#gantt', tasks, {
            header_height: 50,
            column_width: 30,
            step: 24,
            view_modes: ['Quarter Day', 'Half Day', 'Day', 'Week', 'Month'],
            bar_height: 24,
            bar_corner_radius: 4,
            padding: 18,
            view_mode: 'Day',
            date_format: 'YYYY-MM-DD',
            custom_popup_html: function(task) {
              // Mostrar información adicional en el popup
              const extra = task.extra || '';
              return `
                <div class="popup-content">
                  <div class="title">${task.name}</div>
                  <div class="subtitle">${task.start} → ${task.end}</div>
                  <div class="subtitle">Progreso: ${Math.round(task.progress * 100)}%</div>
                  ${extra ? `<div class="subtitle">${extra}</div>` : ''}
                </div>
              `;
            },
            on_date_change: function(task, start, end) {
              // Cuando se arrastra o redimensiona
              saveTask(task.id, start, end, task.progress);
            },
            on_progress_change: function(task, progress) {
              // Cuando se mueve el slider de progreso
              saveTask(task.id, task.start, task.end, progress);
            },
            on_click: function(task) {
              // Opcional: mostrar detalles
              // console.log('Tarea clickeada:', task);
            }
          });
        } catch (error) {
          console.error('Error al inicializar Frappe Gantt:', error);
          showToast('Error al renderizar el diagrama', 'error', 3000);
          statusMsg.style.display = 'block';
          statusText.textContent = 'Error al renderizar el Gantt.';
          ganttEl.style.display = 'none';
        }
      }

      // ---------- GUARDAR TAREA (POST) ----------
      async function saveTask(id, start, end, progress) {
        // Mostrar toast de guardando
        showToast('Guardando cambios...', 'info', 1500);

        try {
          const payload = {
            id: id,
            start: start,
            end: end,
            progress: progress
          };

          const response = await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors', // Importante: Apps Script no permite CORS, usamos no-cors
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
          });

          // Con no-cors, la respuesta no se puede leer, pero se envía.
          // Asumimos éxito si no hay error de red.
          showToast('✅ Guardado correctamente', 'success', 2000);
          
          // Opcional: refrescar datos para sincronizar
          // loadData(); // Descomentar si se quiere recargar siempre
          // Pero para no perder la posición, mejor no recargar completo.
          // Podríamos actualizar localmente, pero es opcional.

        } catch (error) {
          console.error('Error al guardar:', error);
          showToast('Error al guardar: ' + (error.message || 'Error de red'), 'error', 4000);
        }
      }

      // ---------- MANEJAR BÚSQUEDA ----------
      function handleSearch() {
        const filterText = searchInput.value;
        currentFilter = filterText;
        if (allSections.length > 0) {
          const filtered = applyFilter(allSections, filterText);
          renderGantt(filtered);
          // Ajustar mensaje si está vacío
          if (filtered.length === 0 || filtered.every(s => s.tasks.length === 0)) {
            statusMsg.style.display = 'block';
            statusText.textContent = 'No hay tareas que coincidan con la búsqueda.';
            ganttContainer.querySelector('#gantt').style.display = 'none';
          } else {
            statusMsg.style.display = 'none';
            ganttContainer.querySelector('#gantt').style.display = 'block';
          }
        }
      }

      // ---------- INICIALIZAR ----------
      // Cargar datos al inicio
      loadData();

      // Eventos
      refreshBtn.addEventListener('click', function() {
        loadData();
      });

      // Búsqueda con debounce simple
      let searchTimeout = null;
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(handleSearch, 300);
      });

      // También permitir búsqueda con Enter
      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          clearTimeout(searchTimeout);
          handleSearch();
        }
      });

      // ---------- (Opcional) Exponer funciones globales para depuración ----------
      window.__debug = {
        loadData,
        renderGantt,
        saveTask,
        allSections: () => allSections,
      };

    })();
  </script>

</body>
</html>
